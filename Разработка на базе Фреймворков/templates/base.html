{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Roomly{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'homepage/css/style.css' %}">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-light border-bottom mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'homepage:index' %}">
                <img src="{% static 'homepage/img/logo.png' %}" alt="Roomly" class="roomly-logo">
                Roomly
            </a>
            {% include "includes/navigation.html" %}
        </div>
    </nav>
    <main class="container pb-5">
        {% block content %}{% endblock %}
    </main>
    <footer class="roomly-footer border-top py-3">
        <div class="container">
            Roomly, <span id="current-year"></span>
        </div>
    </footer>
    <script src="{% static 'homepage/js/main.js' %}"></script>
</body>
</html>
